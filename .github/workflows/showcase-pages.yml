name: Deploy BEEZ Showcase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          cache-provider: basic

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build Compose Web/Wasm Catalog
        run: gradle --no-daemon :beez-catalog:wasmJsBrowserDistribution

      - name: Assemble Catalog artifact
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R beez-catalog/build/dist/wasmJs/productionExecutable/. dist/
          touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
