name: Deploy BEEZ Showcase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble Showcase artifact
        run: |
          rm -rf dist
          mkdir -p dist/showcase dist/specification
          cp -R showcase/. dist/showcase/
          cp -R specification/tokens dist/specification/
          printf '%s\n' \
            '<!doctype html>' \
            '<html lang="en"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=showcase/"><title>BEEZ Showcase</title></head><body><a href="showcase/">Open BEEZ Showcase</a></body></html>' \
            > dist/index.html
          touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
