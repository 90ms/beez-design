name: Validate BEEZ Libraries

on:
  push:
    branches:
      - main
    paths:
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradle/libs.versions.toml"
      - "beez-*/**"
      - "samples/published-consumer/**"
      - "specification/**"
      - "scripts/**"
      - ".github/workflows/library-validation.yml"
  pull_request:
    paths:
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradle/libs.versions.toml"
      - "beez-*/**"
      - "samples/published-consumer/**"
      - "specification/**"
      - "scripts/**"
      - ".github/workflows/library-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Compile and test libraries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          cache-provider: basic

      - name: Validate token sources
        run: node scripts/validate-tokens.mjs

      - name: Verify token generation
        run: |
          node --test scripts/token-tools.test.mjs scripts/token-kotlin.test.mjs
          node scripts/generate-tokens.mjs --check

      - name: Show toolchain
        run: gradle --version

      - name: Compile and test
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" gradle --no-daemon --stacktrace build

      - name: Publish libraries to staging repository
        run: gradle --no-daemon --stacktrace publishLibrariesToStagingRepository

      - name: Verify published artifact consumer
        working-directory: samples/published-consumer
        run: gradle --no-daemon --stacktrace build

      - name: Upload Gradle reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: beez-gradle-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
